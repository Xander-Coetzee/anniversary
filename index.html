<!DOCTYPE html>
<html lang="af">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1124" />
  <title>Anniversary</title>

  <!-- Google Fonts: Cinzel, Playfair Display & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>

  <!-- NASA APOD 11 September 2025 Background Layer -->
  <div class="background-wrapper">
    <div class="background-image"></div>
    <div class="background-overlay"></div>
    <div class="stars-layer" id="starsLayer"></div>
  </div>

  <!-- Audio Element (Always on Repeat) -->
  <audio id="bgAudio" preload="auto" loop></audio>

  <!-- Notification Toast -->
  <div id="toast" class="toast hidden">
    <span id="toastIcon">✨</span>
    <span id="toastMessage">Boodskap gestuur!</span>
  </div>

  <!-- Floating Hearts Container -->
  <div id="heartsContainer" class="hearts-container"></div>

  <!-- 1. Password Lock Gate (Privacy Protection) -->
  <section id="lockScreen" class="lock-screen">
    <div class="lock-card glass-card">
      <div class="lock-icon">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="lock-title">Slegs vir jou oë</h2>
      <p class="lock-subtitle">Voer ons herdenkingsdatum in om oop te maak</p>
      
      <form id="lockForm" class="lock-form" onsubmit="return false;">
        <input 
          type="text" 
          id="passwordInput" 
          class="lock-input" 
          placeholder="DD/MM/YYYY" 
          autocomplete="off" 
          autocapitalize="off"
        />
        <button type="submit" id="unlockBtn" class="unlock-btn">
          Ontsluit <i class="fa-solid fa-heart"></i>
        </button>
      </form>
      <p id="lockError" class="lock-error hidden">Probeer weer, my engel 💕</p>
    </div>
  </section>

  <!-- 2. Wax Seal Tap-to-Reveal Entrance -->
  <section id="introScreen" class="intro-screen hidden">
    <div class="intro-card glass-card">
      <div class="wax-seal" id="sealBtn" role="button" aria-label="Maak oop">
        <i class="fa-solid fa-heart seal-icon"></i>
      </div>
      <h1 class="intro-title" id="introTitle">Vir My Engel</h1>
    </div>
  </section>

  <!-- 3. Main Anniversary View -->
  <main id="mainContent" class="main-content hidden">

    <!-- Top Rotating Quote Banner (Updates every 30 seconds) -->
    <div class="quote-banner glass-card" id="quoteBanner">
      <span class="quote-sparkle">✨</span>
      <p id="quoteText" class="quote-text">"Laai liefdesboodskap..."</p>
      <span class="quote-sparkle">✨</span>
    </div>

    <!-- Header / Days Together Badge -->
    <header class="header glass-card">
      <div class="badge" id="daysBadge">
        <i class="fa-solid fa-infinity"></i>
        <span id="daysCount">--</span> dae saam
      </div>
    </header>

    <!-- Music Player (Karma Police on Repeat) -->
    <section class="music-card glass-card">
      <div class="player-wrapper">
        <div class="vinyl-disc" id="vinylDisc">
          <div class="vinyl-grooves"></div>
          <button id="playPauseBtn" class="play-btn" aria-label="Speel of pouseer musiek">
            <i class="fa-solid fa-play" id="playIcon"></i>
          </button>
        </div>
      </div>
    </section>

    <!-- Interactive Buttons (Stuur 'n Drukkie / Dink aan Jou) -->
    <section class="actions-container">
      <button class="action-btn hug-btn" id="sendHugBtn">
        <span class="btn-emoji">🫂</span>
        <div class="btn-text">
          <strong>Stuur 'n Drukkie</strong>
          <small>Laat weet hom jy mis hom</small>
        </div>
      </button>

      <button class="action-btn kiss-btn" id="sendKissBtn">
        <span class="btn-emoji">💋</span>
        <div class="btn-text">
          <strong>Dink aan Jou</strong>
          <small>Stuur 'n soentjie</small>
        </div>
      </button>
    </section>

  </main>

  <!-- Scripts -->
  <script src="config.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
